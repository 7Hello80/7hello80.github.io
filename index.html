<body>
<h1><i class="fa-solid fa-images"></i>图片藏文件</h1>
<p class="sub">自动 DCT / LSB 模式选择 · 多图分片 · 多文件 · 在线预览</p>
<div class="grid">
  <div class="panel">
    <h2><i class="fa-solid fa-lock"></i>嵌入文件</h2>
    <label>载体图片（可多选；分片数超过图片数时循环使用并加噪声）</label>
    <input type="file" id="carrierInput" accept="image/*" multiple>
    <label>要藏的文件（可多选，自动打包分片）</label>
    <input type="file" id="payloadInput" multiple>

    <label>模式选择</label>
    <select id="modeSelect">
      <option value="auto" selected>自动（小文件 DCT，大文件 LSB）</option>
      <option value="robust">强制抗压缩（DCT，微信普通发送）</option>
      <option value="capacity">强制大容量（LSB，微信原图发送）</option>
    </select>
    <div class="mode-card" id="modeCard">
      <b>自动模式</b>：先算 DCT 分片数，若 ≤ 最大分片数用 DCT（微信普通发送就能提取）；
      超过则自动切 LSB（容量大，但必须微信<strong>原图</strong>发送）。
    </div>

    <label>自动模式下 DCT 最大分片数（超过则切 LSB）</label>
    <input type="number" id="maxSlicesInput" min="1" max="50" value="8">

    <div class="cap-box" id="capBox">请选择载体图和文件后查看决策…</div>
    <button id="embedBtn"><i class="fa-solid fa-wand-magic-sparkles"></i>生成隐写图</button>
    <div class="progress" id="embedProgress"><div class="progress-bar" id="embedBar"></div></div>
    <div id="embedStatus" class="status"></div>
    <div id="embedPreview" class="preview"></div>
    <div class="hint">
      <i class="fa-solid fa-circle-info"></i> DCT 单张 1080p ≈ 2.6KB，1080×1920 ≈ 4.7KB（抗微信压缩）<br>
      <i class="fa-solid fa-circle-info"></i> LSB 单张容量 ≈ 宽×高×3/8，原尺寸（必须原图发送）<br>
      <i class="fa-solid fa-circle-info"></i> 分片图会打包成 ZIP 下载，提取时可整包上传
    </div>
  </div>
  <div class="panel">
    <h2><i class="fa-solid fa-key"></i>提取文件</h2>
    <label>批量选择所有隐写图，或上传 ZIP 包</label>
    <input type="file" id="stegoInput" accept="image/*,.zip" multiple>
