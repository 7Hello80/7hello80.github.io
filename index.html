<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片藏文件 · WASM 频域隐写</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif; margin: 0; padding: 20px; background: #f5f6fa; color: #222; }
  h1 { font-size: 22px; text-align: center; }
  .sub { text-align: center; font-size: 13px; color: #888; margin: -6px 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .panel h2 { font-size: 17px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 6px; }
  input[type=file] { width: 100%; font-size: 13px; }
  select { padding: 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }
  button { background: #3b6ef5; color: #fff; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; margin-top: 14px; font-size: 14px; }
  button:hover { background: #2a5ae0; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.7; }
  .file-list { margin-top: 12px; }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; background: #fafafa; }
  .file-item .name { flex: 1; font-size: 13px; word-break: break-all; }
  .file-item .size { font-size: 12px; color: #999; }
  .file-item a { font-size: 13px; color: #3b6ef5; text-decoration: none; }
  .file-item button { margin: 0; padding: 4px 10px; font-size: 12px; }
  .preview { margin-top: 12px; }
  .preview img { max-width: 100%; border-radius: 8px; }
  .preview pre { background: #f0f0f0; padding: 10px; border-radius: 6px; max-height: 300px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
  .preview iframe { width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 6px; }
  .status { margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 8px; display: none; }
  .status.ok { display: block; background: #e6f7ea; color: #1a7f37; }
  .status.err { display: block; background: #fdecea; color: #b3261e; }
  .status.info { display: block; background: #eef3ff; color: #2a4ba0; }
  .download { display: inline-block; margin: 6px 0; padding: 8px 16px; background: #1a7f37; color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px; }
  .wasm-badge { display: inline-block; font-size: 11px; background: #e8eaff; color: #4a5cf5; padding: 2px 8px; border-radius: 20px; vertical-align: middle; margin-left: 8px; }
</style>
</head>
<body>
<h1>🖼️ 图片藏文件 <span class="wasm-badge">WASM 加速</span></h1>
<p class="sub">DWT-DCT-SVD 频域隐写 · 多文件打包 · 抗微信压缩 · 在线预览</p>
<div class="grid">
  <div class="panel">
    <h2>① 嵌入文件</h2>
    <label>载体图片（建议长边 ≤1080，纹理丰富效果更好）</label>
    <input type="file" id="carrierInput" accept="image/*">
    <label>要藏的文件（可多选，总大小建议 &lt; 8KB）</label>
    <input type="file" id="payloadInput" multiple>
    <label>鲁棒冗余等级</label>
    <select id="robustSelect">
      <option value="3">平衡（redundancy=3，推荐）</option>
      <option value="2">容量优先（redundancy=2，成功率略低）</option>
      <option value="4">鲁棒优先（redundancy=4，容量减小）</option>
    </select>
    <button id="embedBtn">生成隐写图</button>
    <div id="embedStatus" class="status"></div>
    <div id="embedPreview" class="preview"></div>
    <div class="hint">
      · 算法：DWT-DCT-SVD 奇异值量化 + 冗余副本 + CRC 校验，全部在 WASM 中完成<br>
      · 微信发送时<strong>不要勾选“原图”</strong>，普通图片发送即可测试抗压缩<br>
      · 总载荷超过约 8KB 时失败率会上升，建议先藏小文件测试通路
    </div>
  </div>
  <div class="panel">
    <h2>② 提取文件</h2>
    <label>选择从微信下载的图片</label>
    <input type="file" id="stegoInput" accept="image/*">
    <button id="extractBtn">提取文件</button>
    <div id="extractStatus" class="status"></div>
    <div id="extractFiles" class="file-list"></div>
    <div id="extractPreview" class="preview"></div>
  </div>
</div>

<script type="module">
import { BlindWatermark } from 'https://cdn.jsdelivr.net/npm/blind-watermark-wasm@2.0.0/+esm';

/* ================= 文件容器：多文件打包 ================= */
const MAGIC = [0x48, 0x49, 0x44, 0x45]; // "HIDE"

function packFiles(files) {
  if (files.length > 255) throw new Error('文件数量不能超过 255 个');
  const enc = new TextEncoder();
  const names = files.map(f => enc.encode(f.name));
  let total = 1;
  for (let i = 0; i < files.length; i++)
    total += 2 + names[i].length + 4 + files[i].data.length;
  const out = new Uint8Array(total);
  let p = 0;
  out[p++] = files.length;
  for (let i = 0; i < files.length; i++) {
    const nl = names[i].length;
    out[p++] = (nl >> 8) & 255;
    out[p++] = nl & 255;
    out.set(names[i], p); p += nl;
    const sz = files[i].data.length;
    out[p++] = (sz >>> 24) & 255;
    out[p++] = (sz >>> 16) & 255;
    out[p++] = (sz >>> 8) & 255;
    out[p++] = sz & 255;
    out.set(files[i].data, p); p += sz;
  }
  return out;
}

function unpackFiles(buf) {
  const dec = new TextDecoder();
  let p = 0;
  const count = buf[p++];
  const files = [];
  for (let i = 0; i < count; i++) {
    const nl = (buf[p] << 8) | buf[p + 1]; p += 2;
    const name = dec.decode(buf.subarray(p, p + nl)); p += nl;
    const sz = ((buf[p] << 24) | (buf[p + 1] << 16) | (buf[p + 2] << 8) | buf[p + 3]) >>> 0; p += 4;
    const data = buf.slice(p, p + sz); p += sz;
    files.push({ name, data });
  }
  return files;
}

/* ================= CRC32（附加校验，双保险） ================= */
const crcTable = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildPayload(files) {
  const packed = packFiles(files);
  const len = packed.length;
  const out = new Uint8Array(9 + len + 4);
  out.set(MAGIC, 0);
  out[4] = 1;
  out[5] = (len >>> 24) & 255;
  out[6] = (len >>> 16) & 255;
  out[7] = (len >>> 8) & 255;
  out[8] = len & 255;
  out.set(packed, 9);
  const crc = crc32(packed);
  out[9 + len] = (crc >>> 24) & 255;
  out[9 + len + 1] = (crc >>> 16) & 255;
  out[9 + len + 2] = (crc >>> 8) & 255;
  out[9 + len + 3] = crc & 255;
  return out;
}

function parsePayload(payloadBytes) {
  if (payloadBytes.length < 13) throw new Error('载荷过短');
  if (payloadBytes[0] !== MAGIC[0] || payloadBytes[1] !== MAGIC[1] ||
      payloadBytes[2] !== MAGIC[2] || payloadBytes[3] !== MAGIC[3])
    throw new Error('魔数不匹配，不是本工具生成的数据');
  const len = ((payloadBytes[5] << 24) | (payloadBytes[6] << 16) |
               (payloadBytes[7] << 8) | payloadBytes[8]) >>> 0;
  if (payloadBytes.length < 13 + len) throw new Error('载荷长度越界');
  const packed = payloadBytes.slice(9, 9 + len);
  const crcStored = ((payloadBytes[9 + len] << 24) | (payloadBytes[9 + len + 1] << 16) |
                     (payloadBytes[9 + len + 2] << 8) | payloadBytes[9 + len + 3]) >>> 0;
  if (crc32(packed) !== crcStored) throw new Error('CRC32 校验失败，数据可能损坏');
  return unpackFiles(packed);
}

/* ================= WASM 隐写引擎 ================= */
let bwmInstance = null;

function getBwm(redundancy) {
  // 复用实例，避免重复初始化 WASM
  if (!bwmInstance || bwmInstance._redundancy !== redundancy) {
    bwmInstance = new BlindWatermark({ redundancy });
    bwmInstance._redundancy = redundancy;
  }
  return bwmInstance;
}

async function embedWithWasm(carrierFile, payloadBytes, redundancy) {
  const imageBytes = new Uint8Array(await carrierFile.arrayBuffer());
  const bwm = getBwm(redundancy);
  // 输出 JPEG 保持文件体积较小；算法本身对 JPEG 再压缩有鲁棒性
  const watermarked = await bwm.embed(imageBytes, payloadBytes, 'jpeg');
  return new Blob([watermarked], { type: 'image/jpeg' });
}

async function extractWithWasm(stegoFile) {
  const imageBytes = new Uint8Array(await stegoFile.arrayBuffer());
  // 用默认配置尝试；如果用户嵌入时改了 redundancy，默认值可能不匹配，
  // 但 blind-watermark-wasm 的 redundancy 只影响嵌入端，提取端自动适配。
  const bwm = new BlindWatermark();
  const result = await bwm.extract(imageBytes);
  if (!result) throw new Error('未检测到水印（可能是非本工具生成的图片，或密码不匹配）');
  if (!result.valid) throw new Error('水印校验未通过：图片可能被过度压缩或缩放，请尝试纹理更丰富的载体图');
  return result.bytes; // Uint8Array
}

/* ================= 预览辅助 ================= */
function mimeOf(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const map = {
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif',
    webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp',
    txt: 'text/plain', md: 'text/markdown', json: 'application/json',
    html: 'text/html', css: 'text/css', js: 'text/javascript',
    xml: 'text/xml', csv: 'text/csv', log: 'text/plain',
    pdf: 'application/pdf',
  };
  return map[ext] || 'application/octet-stream';
}
function isText(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  return ['txt', 'md', 'json', 'html', 'css', 'js', 'xml', 'csv', 'log'].includes(ext);
}
function formatSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function renderFiles(files) {
  const listEl = document.getElementById('extractFiles');
  const previewEl = document.getElementById('extractPreview');
  listEl.innerHTML = '';
  previewEl.innerHTML = '';
  for (const f of files) {
    const blob = new Blob([f.data], { type: mimeOf(f.name) });
    const url = URL.createObjectURL(blob);
    const item = document.createElement('div');
    item.className = 'file-item';
    const nameEl = document.createElement('span');
    nameEl.className = 'name';
    nameEl.textContent = f.name;
    const sizeEl = document.createElement('span');
    sizeEl.className = 'size';
    sizeEl.textContent = formatSize(f.data.length);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    a.textContent = '下载';
    const btn = document.createElement('button');
    btn.textContent = '预览';
    btn.onclick = () => previewFile(f, previewEl);
    item.appendChild(nameEl);
    item.appendChild(sizeEl);
    item.appendChild(a);
    item.appendChild(btn);
    listEl.appendChild(item);
  }
}

function previewFile(f, container) {
  container.innerHTML = '';
  const mime = mimeOf(f.name);
  const url = URL.createObjectURL(new Blob([f.data], { type: mime }));
  if (mime.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = url;
    container.appendChild(img);
  } else if (isText(f.name)) {
    const pre = document.createElement('pre');
    pre.textContent = new TextDecoder().decode(f.data);
    container.appendChild(pre);
  } else if (mime === 'application/pdf') {
    const iframe = document.createElement('iframe');
    iframe.src = url;
    container.appendChild(iframe);
  } else {
    container.textContent = '该类型不支持在线预览，请下载后查看。';
  }
}

/* ================= UI 绑定 ================= */
const $ = id => document.getElementById(id);

$('embedBtn').onclick = async () => {
  const carrierFile = $('carrierInput').files[0];
  const payloadFiles = Array.from($('payloadInput').files);
  const status = $('embedStatus');
  const btn = $('embedBtn');

  if (!carrierFile) { alert('请选择载体图片'); return; }
  if (!payloadFiles.length) { alert('请选择要藏的文件'); return; }

  const redundancy = parseInt($('robustSelect').value, 10);
  status.className = 'status info';
  status.textContent = 'WASM 处理中…';
  $('embedPreview').innerHTML = '';
  btn.disabled = true;

  try {
    const files = [];
    for (const f of payloadFiles) {
      files.push({ name: f.name, data: new Uint8Array(await f.arrayBuffer()) });
    }
    const payload = buildPayload(files);

    if (payload.length > 16 * 1024) {
      throw new Error(`载荷 ${formatSize(payload.length)} 过大，WASM 隐写引擎在 1080p 载体上通常只能容纳约 8KB，请减少文件或压缩后再试`);
    }

    const blob = await embedWithWasm(carrierFile, payload, redundancy);
    const url = URL.createObjectURL(blob);

    status.className = 'status ok';
    status.textContent = `嵌入成功！载荷 ${payload.length} 字节，冗余等级 ${redundancy}。请下载后通过微信普通图片发送（不要勾选原图）测试。`;

    const wrap = $('embedPreview');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stego.jpg';
    a.className = 'download';
    a.textContent = '⬇ 下载隐写图';
    const br = document.createElement('br');
    const img = document.createElement('img');
    img.src = url;
    wrap.appendChild(a);
    wrap.appendChild(br);
    wrap.appendChild(img);
  } catch (e) {
    status.className = 'status err';
    status.textContent = '失败：' + e.message;
    console.error(e);
  } finally {
    btn.disabled = false;
  }
};

$('extractBtn').onclick = async () => {
  const file = $('stegoInput').files[0];
  const status = $('extractStatus');
  const btn = $('extractBtn');
  if (!file) { alert('请选择隐写图片'); return; }

  status.className = 'status info';
  status.textContent = 'WASM 提取中…';
  $('extractFiles').innerHTML = '';
  $('extractPreview').innerHTML = '';
  btn.disabled = true;

  try {
    const payloadBytes = await extractWithWasm(file);
    const files = parsePayload(payloadBytes);

    status.className = 'status ok';
    status.textContent = `提取成功！共 ${files.length} 个文件，CRC32 双重校验通过。`;
    renderFiles(files);
  } catch (e) {
    status.className = 'status err';
    status.textContent = '失败：' + e.message;
    console.error(e);
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
