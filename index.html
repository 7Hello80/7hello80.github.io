ap:8px}.preview-thumbnails img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #f0f0f0}.text-success{color:#34c759!important}.text-link{color:var(--primary)!important;text-decoration:none;font-size:14px}.file-item-cell{display:flex;align-items:center;padding:14px 16px;gap:12px;position:relative;cursor:pointer}.file-item-cell:not(:last-child):after{content:"";position:absolute;bottom:0;left:64px;right:0;height:.5px;background:var(--border-color);transform:scaleY(.5)}.file-item-cell:active{background-color:#f9f9f9}.file-icon-wrap{width:36px;height:36px;border-radius:10px;background:#eef5ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px}.file-info{flex:1;display:flex;flex-direction:column;gap:4px;overflow:hidden}.file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-size{font-size:11px;color:var(--text-sub)}.file-action{font-size:12px;color:var(--primary);padding:4px 8px;background:#f2f8ff;border-radius:6px}.preview-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:#000;z-index:9999;display:none;flex-direction:column}.preview-overlay.active{display:flex}.preview-header{display:flex;justify-content:space-between;align-items:center;padding:16px;color:#fff;background:#111}.preview-title{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:16px}.preview-close{font-size:22px;padding:8px;cursor:pointer;color:#aaa}.preview-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative}.preview-media{max-width:100%;max-height:100%;display:block}.preview-frame{width:100%;height:100%;border:none;background:#fff}.preview-text{width:100%;height:100%;padding:16px;margin:0;background:#1e1e1e;color:#d4d4d4;font-family:SF Mono,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;overflow:auto;box-sizing:border-box}.preview-unsupported{color:#999;text-align: </head>
<body>

<!-- 顶部导航栏 (移除返回按钮，居中标题) -->
<div class="nav-header">
  <div class="nav-title">图片藏文件</div>
</div>

<div class="app-container">

  <!-- 模式选择卡片 -->
  <div class="card">
    <div class="card-header-flex">
      <div class="card-title">模式选择</div>
    </div>
    <div class="mode-selector" id="modeSelector">
      <div class="mode-option active" data-mode="auto">
        <div class="mode-title">自动分配</div>
        <div class="mode-desc">智能兼顾抗压与容量</div>
        <i class="fa-solid fa-circle-check mode-check"></i>
      </div>
      <div class="mode-option" data-mode="robust">
        <div class="mode-title">抗压缩</div>
        <div class="mode-desc">牺牲容量，微信免原图</div>
        <i class="fa-solid fa-circle-check mode-check"></i>
      </div>
      <div class="mode-option" data-mode="capacity">
        <div class="mode-title">大容量</div>
        <div class="mode-desc">不限大小，需发送原图</div>
        <i class="fa-solid fa-circle-check mode-check"></i>
      </div>
    </div>
  </div>

  <!-- 嵌入文件卡片 -->
  <div class="card">
    <div class="cell-group">
      
      <!-- 选择载体 -->
      <label class="cell" for="carrierInput">
        <div class="cell-left">
          <i class="fa-solid fa-image cell-icon"></i>
          <span>载体图片</span>
        </div>
        <div class="cell-right">
          <span id="carrierName" class="cell-value">未选择</span>
          <i class="fa-solid fa-chevron-right cell-arrow"></i>
        </div>
        <input type="file" id="carrierInput" accept="image/*" multiple hidden>
      </label>

      <!-- 选择文件 -->
      <label class="cell" for="payloadInput">
        <div class="cell-left">
          <i class="fa-solid fa-file-zipper cell-icon"></i>
          <span>要藏的文件</span>
        </div>
        <div class="cell-right">
          <span id="payloadName" class="cell-value">未选择</span>
          <i class="fa-solid fa-chevron-right cell-arrow"></i>
        </div>
        <input type="file" id="payloadInput" multiple hidden>
      </label>

      <!-- 最大分片数 (仅自动模式生效) -->
      <div class="cell">
        <div class="cell-left">
          <i class="fa-solid fa-sliders cell-icon"></i>
          <span>DCT 分片阈值</span>
        </div>
        <div class="cell-right">
          <input type="number" id="maxSlicesInput" min="1" max="50" value="8" class="cell-number-input">
        </div>
      </div>
      
    </div>

    <!-- 容量与决策面板 -->
    <div class="decision-panel" id="capBox">
      <i class="fa-solid fa-circle-info"></i> 请选择载体图和文件后查看决策…
    </div>

    <!-- 操作按钮 -->
    <div class="action-area">
      <button id="embedBtn" class="btn-primary">生成隐写图</button>
      <div class="progress" id="embedProgress" style="display:none;"><div class="progress-bar" id="embedBar"></div></div>
      <div id="embedStatus" class="status"></div>
    </div>
  </div>

  <!-- 嵌入结果预览卡片 -->
  <div class="card" id="embedResultCard" style="display: none;">
    <div class="cell-group">
      <div class="cell no-border">
        <div class="cell-left">
          <i class="fa-solid fa-check-circle text-success"></i>
          <span class="text-success" style="font-weight: 500; font-size: 14px;">生成成功</span>
        </div>
        <div class="cell-right">
          <a id="downloadZipBtn" class="cell-value text-link">下载 ZIP 包</a>
        </div>
      </div>
    </div>
    <div class="preview-thumbnails" id="embedPreview"></div>
  </div>

  <!-- 提取文件卡片 -->
  <div class="card">
    <div class="cell-group">
      <!-- 选择隐写图 -->
      <label class="cell" for="stegoInput">
        <div class="cell-left">
          <i class="fa-solid fa-key cell-icon"></i>
          <span>选择隐写图/ZIP</span>
        </div>
        <div class="cell-right">
          <span id="stegoName" class="cell-value">未选择</span>
          <i class="fa-solid fa-chevron-right cell-arrow"></i>
        </div>
        <input type="file" id="stegoInput" accept="image/*,.zip" multiple hidden>
      </label>
    </div>

    <div class="action-area">
      <button id="extractBtn" class="btn-secondary">提取文件</button>
      <div class="progress" id="extractProgress" style="display:none;"><div class="progress-bar" id="extractBar"></div></div>
      <div id="extractStatus" class="status"></div>
    </div>
  </div>

  <!-- 提取结果列表卡片 -->
  <div class="card" id="extractResultCard" style="display: none;">
    <div class="cell-group" id="extractFiles">
      <!-- 动态注入文件列表 -->
    </div>
  </div>

</div>

<!-- 预览模态框 (全屏) -->
<div id="previewOverlay" class="preview-overlay">
  <div class="preview-header">
    <div class="preview-title" id="previewTitle">预览</div>
    <div class="preview-close" id="previewClose"><i class="fa-solid fa-xmark"></i></div>
  </div>
  <div class="preview-body" id="previewBody"></div>
  <div class="preview-footer">
    <a id="previewDownload" class="btn-primary" download><i class="fa-solid fa-download"></i> 下载文件</a>
  </div>
</div>

</body>
</html>
